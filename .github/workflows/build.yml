name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read build versions
        id: versions
        run: |
          set -euo pipefail
          tomlprop() {
            local key="$1"
            sed -n "s/^${key}[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" gradle/libs.versions.toml | head -n1
          }
          echo "jdk=$(tomlprop jdk)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(tomlprop minecraft)" >> "$GITHUB_OUTPUT"
          echo "lb=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: liquidbounce-${{ steps.versions.outputs.lb }}+${{ steps.versions.outputs.minecraft }}
          path: build/libs
          if-no-files-found: error
