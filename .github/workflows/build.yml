name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read build versions
        id: versions
        run: |
          set -euo pipefail
          tomlprop() {
            local key="$1"
            sed -n "s/^${key}[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" gradle/libs.versions.toml | head -n1
          }
          echo "jdk=$(tomlprop jdk)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(tomlprop minecraft)" >> "$GITHUB_OUTPUT"
          echo "oneconfig=$(tomlprop oneconfig)" >> "$GITHUB_OUTPUT"
          echo "polycompose=$(tomlprop polycompose)" >> "$GITHUB_OUTPUT"
          echo "lb=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt --console=plain --warning-mode all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiquidBounceOneConfig-${{ steps.versions.outputs.lb }}+${{ steps.versions.outputs.minecraft }}
          path: build/libs
          if-no-files-found: error

      - name: Publish snapshot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          NOTES="Automatic build of \`${GITHUB_SHA::7}\` from \`main\`.

          OneConfig ${{ steps.versions.outputs.oneconfig }} / PolyCompose ${{ steps.versions.outputs.polycompose }} for Minecraft ${{ steps.versions.outputs.minecraft }}."

          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "$JAR" \
            --title "Snapshot" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
